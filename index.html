<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 1.4rem; margin: 8px 0 2px; letter-spacing: 2px; }
  #ver { font-size: .8rem; color: #64748b; margin-bottom: 8px; letter-spacing: 2px; }
  #devip { font-size: .75rem; color: #64748b; margin-bottom: 8px; }
  #scorebar { display: flex; gap: 28px; margin-bottom: 10px; font-size: 1rem; color: #94a3b8; }
  #scorebar b { color: #fbbf24; font-size: 1.2rem; margin-left: 4px; }
  #diffbar { display: flex; gap: 8px; margin-bottom: 10px; }
  #diffbar button { background: #334155; color: #e2e8f0; font-size: .85rem; padding: 7px 18px; font-weight: 600; }
  #diffbar button.active { background: #22c55e; color: #052e16; }
  #modebar { display: flex; gap: 8px; margin-bottom: 10px; }
  #modebar button { background: #334155; color: #e2e8f0; font-size: .85rem; padding: 7px 18px; font-weight: 600; }
  #modebar button.active { background: #38bdf8; color: #082f49; }
  #scorebar .p1 b { color: #4ade80; }
  #scorebar .p2 b { color: #38bdf8; }
  #wrap { position: relative; width: min(92vw, 420px); }
  canvas {
    display: block; width: 100%; height: auto;
    background: #1e293b; border-radius: 10px;
    touch-action: none;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(15,23,42,.88); border-radius: 10px; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 1.7rem; margin-bottom: 10px; }
  #overlay p { margin-bottom: 16px; color: #94a3b8; line-height: 1.6; }
  button {
    font-size: 1rem; padding: 10px 26px; border: none; border-radius: 10px;
    background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer;
  }
  button:active { transform: scale(.96); }
  #btnbar { margin-top: 12px; display: flex; gap: 10px; }
  #btnbar button { background: #334155; color: #e2e8f0; font-size: .92rem; padding: 9px 20px; font-weight: 600; }
  #controls {
    margin-top: 14px; display: grid;
    grid-template-columns: repeat(3, 66px); grid-template-rows: repeat(3, 66px); gap: 8px;
    touch-action: none;
  }
  .dbtn { background: #334155; color: #e2e8f0; font-size: 1.5rem; padding: 0; border-radius: 14px; }
  .dbtn:active { background: #475569; }
  .hint { margin-top: 12px; font-size: .8rem; color: #64748b; text-align: center; line-height: 1.7; }
  #lobby {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(15,23,42,.92); border-radius: 10px; text-align: center; padding: 20px;
  }
  #lobby.hidden { display: none; }
  #lobby h2 { font-size: 1.4rem; margin-bottom: 14px; }
  #lobby input {
    font-size: 1rem; padding: 9px 12px; border-radius: 10px; border: 1px solid #475569;
    background: #0f172a; color: #e2e8f0; width: 150px; text-align: center;
    letter-spacing: 2px; text-transform: uppercase; margin-right: 8px;
  }
  #lobbyRow { display: flex; align-items: center; margin-top: 12px; }
  #lobbyMsg { margin-top: 12px; font-size: .85rem; color: #fbbf24; min-height: 1.2em; }
  #qr { margin: 10px auto; background: #fff; padding: 8px; border-radius: 8px; display: inline-block; }
  #qr img { display: block; }
  #roomCodeBig { font-size: 1.6rem; letter-spacing: 4px; color: #4ade80; font-weight: 700; }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div id="ver">v1.5.0</div>
  <div id="devip" hidden></div>
  <div id="modebar"></div>
  <div id="scorebar"><span id="sb-single">得分<b id="score">0</b></span><span id="sb-high">最高分<b id="high">0</b></span><span id="sb-p1" class="p1" hidden>P1<b id="score1">0</b></span><span id="sb-p2" class="p2" hidden>P2<b id="score2">0</b></span></div>
  <div id="diffbar">
    <button data-d="easy">简单</button>
    <button data-d="normal">普通</button>
    <button data-d="hard">困难</button>
  </div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">贪吃蛇</h2>
      <p id="ovText">吃到食物得分，蛇越长速度越快<br>撞墙或咬到自己就结束</p>
      <button id="ovBtn">开始</button>
    </div>
    <div id="lobby" class="hidden">
      <h2>双人联机</h2>
      <div id="lobbyMain">
        <button id="createBtn">创建房间</button>
        <div id="lobbyRow">
          <input id="roomInput" placeholder="房间码" maxlength="6" autocomplete="off">
          <button id="joinBtn">加入房间</button>
        </div>
      </div>
      <div id="lobbyWait" class="hidden">
        <p>房间码</p>
        <div id="roomCodeBig">------</div>
        <div id="qr"></div>
        <p style="font-size:.8rem;color:#94a3b8">朋友连上同一 Wi-Fi 或手机热点后扫码加入</p>
        <p id="lobbyWaitText">等待朋友加入…</p>
      </div>
      <p id="lobbyMsg"></p>
    </div>
  </div>
  <div id="btnbar">
    <button id="pauseBtn">暂停</button>
    <button id="restartBtn">重新开始</button>
  </div>
  <div id="controls">
    <span></span><button class="dbtn" data-dir="up" aria-label="上">▲</button><span></span>
    <button class="dbtn" data-dir="left" aria-label="左">◀</button><span></span><button class="dbtn" data-dir="right" aria-label="右">▶</button>
    <span></span><button class="dbtn" data-dir="down" aria-label="下">▼</button><span></span>
  </div>
  <p class="hint">电脑：方向键 / WASD 移动，空格暂停，回车重开<br>手机：在画面上滑动，或点下方方向按钮</p>

<!--{{QRCODE_LIB}}-->
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var GRID = 20, CELL = 400 / GRID;
  var scoreEl = document.getElementById('score');
  var highEl = document.getElementById('high');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var restartBtn = document.getElementById('restartBtn');
  var score1El = document.getElementById('score1');
  var score2El = document.getElementById('score2');
  var modebar = document.getElementById('modebar');
  var controlsEl = document.getElementById('controls');
  var hintEl = document.querySelector('.hint');

  // ===== 集中设置：设备 → 可用模式（只改这里，不分散写死在各处）=====
  // desktop: 单人 + 同屏双人（本地、不联网）
  // mobile:  单人 + 双人联机（v1.4.0 起；公开 Pages 版隐藏联机选项）
  var MODES_BY_DEVICE = {
    desktop: ['single', 'versus'],
    mobile: ['single', 'online']
  };
  var MODE_LABEL = { single: '单人', versus: '双人', online: '双人联机' };

  // ===== 局域网构建开关（build.py 在固件版中替换为 true）=====
  var LAN_BUILD = /*{{LAN_BUILD}}*/false;
  var DEVICE_IP = '{{DEVICE_IP}}'; // 固件 serving 时替换为板子实际 IP

  // 固件版：在页顶显示板子本机 IP，方便第二台手机直接输入 IP 访问
  // （Pages 版 LAN_BUILD=false，不显示；占位未被替换时也不显示）
  (function showDeviceIp() {
    if (!LAN_BUILD) return;
    if (DEVICE_IP.indexOf('{{') === 0) return;
    var el = document.getElementById('devip');
    el.textContent = '本机 IP：' + DEVICE_IP + '（或用 http://snake-game.local/）';
    el.hidden = false;
  })();

  function detectDevice() {
    // 判断方法：以主输入是否为触控（pointer: coarse）为准，UA 关键词作兜底；
    // 返回值只有 'desktop' | 'mobile'，所有模式开关都读它。
    var coarse = false;
    try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    var ua = '';
    try { ua = navigator.userAgent || ''; } catch (e2) {}
    var uaMobile = /Mobi|Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    return (coarse || uaMobile) ? 'mobile' : 'desktop';
  }
  var DEVICE = detectDevice();
  var AVAILABLE_MODES = MODES_BY_DEVICE[DEVICE] || ['single'];
  if (!LAN_BUILD) {
    // 公开 Pages 版：隐藏联机选项（单片机版才有）
    AVAILABLE_MODES = AVAILABLE_MODES.filter(function (m) { return m !== 'online'; });
  }
  var mode = LAN_BUILD ? 'online' : 'single'; // 'single' | 'versus' | 'online'

  // 同屏双人配色：P1 绿 / P2 蓝
  var PCOLORS = [
    { name: 'P1', body: '#22c55e', head: '#4ade80' },
    { name: 'P2', body: '#0284c7', head: '#38bdf8' }
  ];
  var players = null; // versus: [{snake, dir, nextDir, score, alive}, ...]

  var snake, dir, nextDir, food, score, high, timer, running, paused, over;

  function loadHigh() {
    try { return parseInt(localStorage.getItem('snake-high-score') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveHigh() {
    try { localStorage.setItem('snake-high-score', String(high)); } catch (e) {}
  }
  high = loadHigh();
  highEl.textContent = high;

  var DIFF = {
    easy:   { base: 190, min: 100, step: 2 },
    normal: { base: 150, min: 70,  step: 3 },
    hard:   { base: 120, min: 45,  step: 4 }
  };
  var difficulty = 'normal';
  try { difficulty = localStorage.getItem('snake-difficulty') || 'normal'; } catch (e) {}
  if (!DIFF[difficulty]) difficulty = 'normal';

  function speed() {
    var d = DIFF[difficulty];
    var s = score;
    if (mode === 'versus' && players) s = Math.max(players[0].score, players[1].score);
    return Math.max(d.min, d.base - s * d.step);
  }

  function allBodies() {
    if (mode === 'versus' && players) return players[0].snake.concat(players[1].snake);
    return snake;
  }

  // 联机模式用种子随机（两端食物一致），其他模式用 Math.random
  var rngFn = null;
  function rand() { return rngFn ? rngFn() : Math.random(); }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function placeFood() {
    while (true) {
      var f = { x: Math.floor(rand() * GRID), y: Math.floor(rand() * GRID) };
      var onSnake = allBodies().some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!onSnake) { food = f; return; }
    }
  }

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
    over = false;
    paused = false;
    pauseBtn.textContent = '暂停';
  }

  function versusReset() {
    players = [
      { snake: [{ x: 4, y: 10 }, { x: 3, y: 10 }, { x: 2, y: 10 }], dir: { x: 1, y: 0 }, nextDir: { x: 1, y: 0 }, score: 0, alive: true },
      { snake: [{ x: 15, y: 10 }, { x: 16, y: 10 }, { x: 17, y: 10 }], dir: { x: -1, y: 0 }, nextDir: { x: -1, y: 0 }, score: 0, alive: true }
    ];
    score1El.textContent = '0';
    score2El.textContent = '0';
    placeFood();
    over = false;
    paused = false;
    pauseBtn.textContent = '暂停';
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > high) {
      high = score;
      highEl.textContent = high;
      saveHigh();
    }
  }

  function versusUpdateScore() {
    // 双人不计入单人最高分
    score1El.textContent = players[0].score;
    score2El.textContent = players[1].score;
  }

  function draw() {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#f87171';
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    if (mode === 'versus' && players) {
      for (var p = 0; p < 2; p++) {
        var pl = players[p], c = PCOLORS[p];
        for (var i = 0; i < pl.snake.length; i++) {
          ctx.fillStyle = i === 0 ? c.head : c.body;
          ctx.fillRect(pl.snake[i].x * CELL + 1, pl.snake[i].y * CELL + 1, CELL - 2, CELL - 2);
        }
      }
      return;
    }
    for (var k = 0; k < snake.length; k++) {
      ctx.fillStyle = k === 0 ? '#4ade80' : '#22c55e';
      ctx.fillRect(snake[k].x * CELL + 1, snake[k].y * CELL + 1, CELL - 2, CELL - 2);
    }
  }

  function showOverlay(title, text, btnLabel, action) {
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    ovBtn.textContent = btnLabel;
    ovBtn.onclick = action;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function restartTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, speed());
  }

  function start() {
    if (mode === 'versus') versusReset();
    else reset();
    hideOverlay();
    running = true;
    restartTimer();
    draw();
  }

  function gameOver() {
    over = true;
    running = false;
    if (timer) clearInterval(timer);
    showOverlay('游戏结束', '得分 ' + score + '，最高分 ' + high, '再来一局', start);
  }

  function versusGameOver() {
    over = true;
    running = false;
    if (timer) clearInterval(timer);
    if (mode === 'online') {
      // 联机：两端各自独立判定（确定性同步，结果一致），顺手通知对方兜底
      var a = players[0].alive, b = players[1].alive;
      var w = a && !b ? 0 : (!a && b ? 1 : 2);
      wsSend({ t: 'over', w: w });
      showOnlineResult(w);
      return;
    }
    var a2 = players[0].alive, b2 = players[1].alive;
    var title = a2 && !b2 ? 'P1 获胜！' : (!a2 && b2 ? 'P2 获胜！' : '平局！');
    showOverlay(title, 'P1 得分 ' + players[0].score + '，P2 得分 ' + players[1].score, '再来一局', start);
  }

  // ================= 局域网联机（online 模式，v1.4.0）==================
  // 服务器是"哑转发"：只做房间配对和消息原样中继，不解析游戏逻辑。
  // 两端跑同一份确定性模拟：每 tick 交换方向输入，食物用种子随机，
  // 各自独立判定输赢（规则与同屏双人一致）。
  var lobbyEl = document.getElementById('lobby');
  var lobbyMain = document.getElementById('lobbyMain');
  var lobbyWait = document.getElementById('lobbyWait');
  var lobbyMsgEl = document.getElementById('lobbyMsg');
  var roomInput = document.getElementById('roomInput');
  var roomCodeBig = document.getElementById('roomCodeBig');
  var qrEl = document.getElementById('qr');
  var lobbyWaitText = document.getElementById('lobbyWaitText');
  var diffbarEl = document.getElementById('diffbar');

  var ws = null;
  var myIdx = 0;            // 我是 P1(0)/P2(1)
  var roomCode = '';
  var peerDir = { x: -1, y: 0 }; // 对方上一 tick 方向（没收到时沿用）
  var tickN = 0;
  var onlineStarted = false;
  var ONLINE_TICK_MS = 150; // 联机固定 tick，两端一致

  var DIRS_BY_NAME = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  function dirName(d) {
    if (d.x === 1) return 'right';
    if (d.x === -1) return 'left';
    if (d.y === 1) return 'down';
    return 'up';
  }
  function genRoomCode() {
    var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    var c = '';
    for (var i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
  }
  function lobbyMsg(t) { lobbyMsgEl.textContent = t || ''; }
  function wsSend(obj) {
    if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(obj)); } catch (e) {} }
  }
  function closeWs() {
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} ws = null; }
  }

  function showLobby() {
    hideOverlay();
    lobbyEl.classList.remove('hidden');
    lobbyMain.classList.remove('hidden');
    lobbyWait.classList.add('hidden');
    lobbyMsg('');
    var m = (location.hash || '').match(/room=([A-Za-z0-9]{6})/i);
    if (m) { roomInput.value = m[1].toUpperCase(); joinRoom(); }
  }
  function hideLobby() { lobbyEl.classList.add('hidden'); }

  function enterOnlineLobby() {
    onlineStarted = false;
    rngFn = null;
    closeWs();
    if (timer) clearInterval(timer);
    running = false; over = false; paused = false;
    pauseBtn.textContent = '暂停';
    showLobby();
    reset();
    draw();
  }

  function connectWs(onOpen) {
    closeWs();
    var url = 'ws://' + location.hostname + ':81/';
    try { ws = new WebSocket(url); }
    catch (e) { lobbyMsg('连不上单片机'); return; }
    ws.onopen = onOpen;
    ws.onmessage = onWsMessage;
    ws.onclose = function () {
      if (mode === 'online' && onlineStarted && !over) {
        onlineStarted = false;
        showOverlay('连接断开', '与单片机的连接已断开', '返回大厅', enterOnlineLobby);
      }
    };
    ws.onerror = function () { lobbyMsg('连不上单片机，请确认连的是同一 Wi-Fi'); };
  }

  function createRoom() {
    roomCode = genRoomCode();
    lobbyMsg('正在创建房间…');
    connectWs(function () { wsSend({ t: 'join', room: roomCode }); });
  }
  function joinRoom() {
    var code = (roomInput.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 6) { lobbyMsg('请输入 6 位房间码'); return; }
    roomCode = code;
    lobbyMsg('正在加入房间…');
    connectWs(function () { wsSend({ t: 'join', room: roomCode }); });
  }

  function onWsMessage(ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.t === 'ok') {
      myIdx = msg.you | 0;
      peerDir = myIdx === 0 ? { x: -1, y: 0 } : { x: 1, y: 0 };
      lobbyMain.classList.add('hidden');
      lobbyWait.classList.remove('hidden');
      roomCodeBig.textContent = roomCode;
      lobbyMsg('');
      qrEl.innerHTML = '';
      if (myIdx === 0) {
        lobbyWaitText.textContent = '等待朋友加入…';
        try {
          var qr = qrcode(0, 'M');
          qr.addData('http://' + DEVICE_IP + '/#room=' + roomCode);
          qr.make();
          qrEl.innerHTML = qr.createImgTag(4, 0);
        } catch (e) {}
      } else {
        lobbyWaitText.textContent = '已加入，等待房主开始…';
      }
    } else if (msg.t === 'full') {
      lobbyMsg('房间已满，换个房间码试试');
      closeWs();
    } else if (msg.t === 'paired') {
      // 房主收到配对成功：发开始信号（含食物种子）并开局
      if (myIdx === 0 && !onlineStarted) {
        var seed = (Math.random() * 4294967296) >>> 0;
        wsSend({ t: 'go', seed: seed });
        startOnline(seed);
      }
    } else if (msg.t === 'go') {
      if (!onlineStarted) startOnline(msg.seed >>> 0);
    } else if (msg.t === 'i') {
      var d = DIRS_BY_NAME[msg.d];
      if (d) peerDir = { x: d[0], y: d[1] };
    } else if (msg.t === 'over') {
      if (onlineStarted && !over) {
        over = true; running = false;
        if (timer) clearInterval(timer);
        showOnlineResult(msg.w | 0);
      }
    } else if (msg.t === 'left') {
      if (onlineStarted && !over) {
        over = true; running = false;
        if (timer) clearInterval(timer);
        showOverlay('对方离开了', '对方已断开连接', '返回大厅', enterOnlineLobby);
      }
    }
  }

  function startOnline(seed) {
    rngFn = mulberry32(seed);
    tickN = 0;
    versusReset(); // 复用双人初始布局与 P1/P2 配色
    hideLobby();
    hideOverlay();
    onlineStarted = true;
    running = true;
    if (timer) clearInterval(timer);
    timer = setInterval(onlineTick, ONLINE_TICK_MS);
    draw();
  }

  function showOnlineResult(w) {
    // w: 0=P1胜 1=P2胜 2=平局
    onlineStarted = false;
    var title = w === 2 ? '平局！' : (w === myIdx ? '你赢了！' : '你输了！');
    var detail = 'P1 得分 ' + players[0].score + '，P2 得分 ' + players[1].score +
      '<br>你是 ' + (myIdx === 0 ? 'P1（绿）' : 'P2（蓝）');
    showOverlay(title, detail, '返回大厅', enterOnlineLobby);
  }

  function onlineTick() {
    wsSend({ t: 'i', d: dirName(players[myIdx].dir), n: tickN++ });
    players[1 - myIdx].nextDir = { x: peerDir.x, y: peerDir.y };
    versusTick(); // 复用双人判定；吃到食物时不重设计时器（联机固定 tick）
  }

  function setOnlineDir(x, y) {
    if (!running || paused || over || mode !== 'online' || !players) return;
    var p = players[myIdx];
    if (!p.alive) return;
    if (x === -p.dir.x && y === -p.dir.y) return;
    p.nextDir = { x: x, y: y };
  }
  function setMyDir(x, y) {
    if (mode === 'online') setOnlineDir(x, y);
    else if (mode !== 'versus') setDir(x, y);
  }

  document.getElementById('createBtn').addEventListener('click', createRoom);
  document.getElementById('joinBtn').addEventListener('click', joinRoom);
  // ================= 联机部分结束 =================

  function tick() {
    if (mode === 'versus') { versusTick(); return; }
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    var hitSelf = snake.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitWall || hitSelf) { gameOver(); return; }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      updateScore();
      placeFood();
      restartTimer();
    } else {
      snake.pop();
    }
    draw();
  }

  function versusTick() {
    var i, p, j, head;
    // 两条蛇同时移动
    for (i = 0; i < 2; i++) {
      p = players[i];
      if (!p.alive) continue;
      p.dir = p.nextDir;
      p.snake.unshift({ x: p.snake[0].x + p.dir.x, y: p.snake[0].y + p.dir.y });
    }
    // 判定死亡：撞墙，或撞到除自己头之外的任何身体（含对方的头，对撞算平局）
    var bodies = players[0].snake.concat(players[1].snake);
    var len0 = players[0].snake.length;
    var deaths = [false, false];
    for (i = 0; i < 2; i++) {
      p = players[i];
      if (!p.alive) continue;
      head = p.snake[0];
      var selfHeadIdx = i === 0 ? 0 : len0;
      var dead = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
      if (!dead) {
        for (j = 0; j < bodies.length; j++) {
          if (j === selfHeadIdx) continue;
          if (bodies[j].x === head.x && bodies[j].y === head.y) { dead = true; break; }
        }
      }
      deaths[i] = dead;
    }
    for (i = 0; i < 2; i++) if (deaths[i]) players[i].alive = false;
    if (!players[0].alive || !players[1].alive) { versusGameOver(); return; }
    // 吃食物
    var ate = false;
    for (i = 0; i < 2; i++) {
      p = players[i];
      if (p.snake[0].x === food.x && p.snake[0].y === food.y) {
        p.score++;
        ate = true;
        placeFood();
      } else {
        p.snake.pop();
      }
    }
    versusUpdateScore();
    if (ate && mode !== 'online') restartTimer(); // 联机用固定 tick，不重设计时器
    draw();
  }

  function togglePause() {
    if (!running || over) return;
    paused = !paused;
    if (paused) {
      if (timer) clearInterval(timer);
      pauseBtn.textContent = '继续';
      showOverlay('已暂停', '休息一下吧', '继续', togglePause);
    } else {
      pauseBtn.textContent = '暂停';
      hideOverlay();
      restartTimer();
    }
  }

  function setDir(x, y) {
    if (!running || paused || over || mode === 'versus') return;
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x: x, y: y };
  }

  function setVersusDir(pi, x, y) {
    if (!running || paused || over || mode !== 'versus' || !players) return;
    var p = players[pi];
    if (!p.alive) return;
    if (x === -p.dir.x && y === -p.dir.y) return;
    p.nextDir = { x: x, y: y };
  }

  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var ARROWS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  var P1KEYS = { KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0] };
  var KEYS = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0]
  };

  document.addEventListener('keydown', function (e) {
    if (mode === 'online') {
      // 联机：只管自己那条蛇；暂停会 desync，直接禁用
      if (KEYS[e.code]) {
        var dd = KEYS[e.code];
        setOnlineDir(dd[0], dd[1]);
        e.preventDefault();
      }
      return;
    }
    if (mode === 'versus') {
      if (P1KEYS[e.code]) {
        var d1 = P1KEYS[e.code];
        setVersusDir(0, d1[0], d1[1]);
        e.preventDefault();
      } else if (ARROWS[e.code]) {
        var d2 = ARROWS[e.code];
        setVersusDir(1, d2[0], d2[1]);
        e.preventDefault();
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (!running && !over) start();
        else togglePause();
      } else if (e.code === 'Enter') {
        start();
      }
      return;
    }
    if (KEYS[e.code]) {
      setDir(KEYS[e.code][0], KEYS[e.code][1]);
      e.preventDefault();
    } else if (e.code === 'Space') {
      e.preventDefault();
      if (!running && !over) start();
      else togglePause();
    } else if (e.code === 'Enter' || e.code === 'KeyR') {
      start();
    } else if (e.code === 'KeyP') {
      togglePause();
    }
  });

  var tsx = 0, tsy = 0;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    tsx = t.clientX; tsy = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setMyDir(dx > 0 ? 1 : -1, 0);
    else setMyDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  var dbtns = document.querySelectorAll('.dbtn');
  for (var i = 0; i < dbtns.length; i++) {
    (function (b) {
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var d = DIRS[b.getAttribute('data-dir')];
        setMyDir(d[0], d[1]);
      });
    })(dbtns[i]);
  }

  var diffBtns = document.querySelectorAll('#diffbar button');
  function renderDiff() {
    for (var i = 0; i < diffBtns.length; i++) {
      var b = diffBtns[i];
      if (b.getAttribute('data-d') === difficulty) b.classList.add('active');
      else b.classList.remove('active');
    }
  }
  for (var k = 0; k < diffBtns.length; k++) {
    (function (b) {
      b.addEventListener('click', function () {
        difficulty = b.getAttribute('data-d');
        try { localStorage.setItem('snake-difficulty', difficulty); } catch (e) {}
        renderDiff();
        start();
      });
    })(diffBtns[k]);
  }
  renderDiff();

  function renderModes() {
    // 模式按钮全部由 AVAILABLE_MODES（集中设置）生成
    modebar.innerHTML = '';
    if (AVAILABLE_MODES.length <= 1) { modebar.style.display = 'none'; return; }
    modebar.style.display = '';
    AVAILABLE_MODES.forEach(function (m) {
      var b = document.createElement('button');
      b.textContent = MODE_LABEL[m] || m;
      if (m === mode) b.classList.add('active');
      b.addEventListener('click', function () {
        if (mode === m) return;
        if (running && mode === 'online') { closeWs(); onlineStarted = false; rngFn = null; }
        mode = m;
        renderModes();
        renderScorebar();
        renderControls();
        if (m === 'online') enterOnlineLobby();
        else start();
      });
      modebar.appendChild(b);
    });
  }

  function renderScorebar() {
    var v = mode === 'versus' || mode === 'online';
    document.getElementById('sb-single').hidden = v;
    document.getElementById('sb-high').hidden = v;
    document.getElementById('sb-p1').hidden = !v;
    document.getElementById('sb-p2').hidden = !v;
  }

  function renderControls() {
    // 双人模式必须用键盘，隐藏触屏方向键；联机模式固定 tick，隐藏难度条
    controlsEl.style.display = mode === 'versus' ? 'none' : '';
    diffbarEl.style.display = mode === 'online' ? 'none' : '';
    hintEl.innerHTML = mode === 'versus'
      ? 'P1（绿）：WASD 移动<br>P2（蓝）：方向键移动，撞墙或撞到蛇就输'
      : (mode === 'online'
        ? '在画面上滑动或点方向按钮移动<br>与朋友各控一条蛇，规则同双人模式'
        : '电脑：方向键 / WASD 移动，空格暂停，回车重开<br>手机：在画面上滑动，或点下方方向按钮');
  }

  ovBtn.onclick = start;
  pauseBtn.onclick = function () { if (mode !== 'online') togglePause(); }; // 联机暂停会 desync，禁用
  restartBtn.onclick = function () { if (mode === 'online') enterOnlineLobby(); else start(); };

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && running && !paused && !over && mode !== 'online') togglePause();
  });

  renderModes();
  renderScorebar();
  renderControls();
  if (mode === 'online') enterOnlineLobby();
  else { reset(); draw(); }
})();
</script>
</body>
</html>
